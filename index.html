<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>현장별 교섭현황</title><style>
:root{--bg:#050a20;--card:#1d2a40;--line:#33445e;--blue:#4ea1ff;--yellow:#fff2cc;--text:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:10;background:#050a20f7;padding:18px 14px 10px;border-bottom:1px solid #202c45}h1{font-size:21px;margin:0 0 12px}.search{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:#071126;color:white;padding:0 12px}.tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 2px;scrollbar-width:none}.tab{border:1px solid #3b4a61;background:#172238;color:#b9c3d2;border-radius:20px;padding:7px 12px;white-space:nowrap;font-weight:700;font-size:13px;cursor:pointer}.tab.active{background:#287fe0;border-color:#4299ff;color:#fff}.count{color:#8190a6;font-size:12px;margin:12px 14px}.list{padding:0 12px 20px}.card{background:linear-gradient(145deg,#1d2a40,#1a263a);border:1px solid var(--line);border-radius:15px;padding:14px 12px;margin:10px 0;cursor:pointer}.top{display:flex;gap:10px;align-items:flex-start}.branch{min-width:52px;padding:8px 5px;border-radius:12px;background:#07132f;color:var(--blue);font-size:12px;font-weight:800;text-align:center}.idx{display:block;font-size:10px;color:#8f9db0;font-weight:400}.main{flex:1;min-width:0}.name{font-size:16px;font-weight:800;margin-bottom:5px;word-break:keep-all;overflow-wrap:break-word}.meta{font-size:12px;color:#8997aa;overflow-wrap:anywhere}.right{flex:0 0 100px;max-width:100px;min-width:0;text-align:right;font-size:12px;overflow-wrap:break-word}.install{color:#61b0ff;font-weight:700;line-height:1.4;word-break:keep-all;overflow-wrap:break-word}.numbers{color:#d294ff;margin-top:4px;font-weight:700}.body{border-top:1px solid #35415980;margin-top:10px;padding-top:9px;font-size:13px;color:#d9e0eb}.neg{line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;background:#152239;border:1px solid #2e3e57;padding:3px 6px;border-radius:6px}.changed{background:var(--yellow);color:#222;border-radius:4px;padding:1px 3px;font-weight:700}.details{display:none;border-top:1px dashed #2d3d57;margin-top:10px;padding-top:8px;color:#c6cfdd;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.card.open .details{display:block}.more{text-align:right;color:#64aaff;font-size:11px;margin-top:8px}.rental{margin:15px 12px 30px;background:#121e33;border:1px solid #293a54;border-radius:12px;padding:12px}.rental h2{font-size:15px;margin:0 0 10px;color:var(--blue)}.rrow{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #26364e;padding:8px 0;font-size:12px}.rrow b{min-width:100px}.rrow span{color:#9facbd;text-align:right}.empty{text-align:center;color:#8190a6;padding:35px 10px}[hidden]{display:none!important}.contact-card{cursor:default;padding:0;overflow:hidden}.contact-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px;min-height:50px}.contact-card summary::-webkit-details-marker{display:none}.contact-card summary:focus-visible{outline:2px solid #4ea1ff;outline-offset:-2px}.contact-card .name{color:#f5f7fb;margin:0}.contact-expand{color:#82baff;font-size:19px;flex:0 0 auto;transition:transform .15s}.contact-card[open] .contact-expand{transform:rotate(180deg)}.contact-content{border-top:1px solid #35415980;padding:9px 12px 14px}.contact-rows{display:grid;gap:5px}.contact-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;border-top:1px solid #33445e;padding:7px 0;font-size:13px;align-items:start}.contact-row>span{color:#9eacc0}.contact-row>b{font-weight:600;overflow-wrap:anywhere;word-break:keep-all}.contact-row a{color:#81bdff;text-decoration:underline;text-underline-offset:3px}.contact-title{font-size:13px;font-weight:800;color:#82baff;border-top:1px solid #33445e;margin-top:10px;padding-top:12px;margin-bottom:6px}.contact-person{margin-top:8px;padding:5px 10px;border:1px solid #33445e;border-radius:8px;background:#142138}.contact-person .contact-row:first-child{border-top:0}.missing{color:#8290a2;font-weight:400}.contact-empty{font-size:13px;color:#9aa8ba;line-height:1.8}
</style></head><body><header><h1>현장별 교섭현황</h1><input class="search" id="search" placeholder="현장명, 구분, 임대사 등 검색..."><div id="tabs" class="tabs"></div><div id="subtabs" class="tabs"></div></header><div class="count" id="count"></div><main class="list" id="list"></main><section class="rental" id="rentals"></section><script>
let DATA,sheet='',branch='전체',q='';const order=['전체','중부','남부','남서','북부','북서','서부','동부','용인'];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const CONTACT_TAB='임대사 정보 및 교섭 담당자 연락처';const names=()=>[...Object.keys(DATA.sheets),CONTACT_TAB];function changed(s,i,c){return(DATA.changed?.[s]||[]).some(m=>m[0]===i&&(m[1]===undefined||m.slice(1).includes(c)))}function mark(x,s,i,c){return changed(s,i,c)?'<span class="changed">'+esc(x)+'</span>':esc(x)}function render(){if(!DATA)return;document.getElementById('tabs').innerHTML=names().map((s,i)=>`<button class="tab ${s===sheet?'active':''}" data-sheet="${i}">${esc(s==='현장별교섭현황'?'대형':s)}</button>`).join('');document.getElementById('subtabs').innerHTML=order.map((b,i)=>`<button class="tab ${b===branch?'active':''}" data-branch="${i}">${b}</button>`).join('');let all=DATA.sheets[sheet]||[];let rows=all.map((r,i)=>({r,i})).filter(({r})=>(branch==='전체'||r['구분']===branch)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=`${sheet==='현장별교섭현황'?'대형현장':'소형현장'} · ${rows.length}개 현장 (업데이트: ${DATA.updated||'-'})`;document.getElementById('list').innerHTML=rows.length?rows.map(({r,i},n)=>card(r,i,n+1)).join(''):'<div class="empty">조건에 맞는 현장이 없습니다.</div>';document.getElementById('rentals').innerHTML='<h2>임대사별 약속사항</h2>'+(DATA.rentals||[]).map(r=>`<div class="rrow"><b>${esc(r['임대사'])}</b><span>${esc(r['약속사항'])}</span></div>`).join('');document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{sheet=names()[+b.dataset.sheet];branch='전체';render()});document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{branch=order[+b.dataset.branch];render()});document.querySelectorAll('.card:not(.contact-card)').forEach(c=>c.onclick=()=>c.classList.toggle('open'));renderContactMode()}function card(r,i,seq){let n=['총대수','배정대수','설치대수'].filter(k=>r[k]).map(k=>k.replace('대수','')+' '+r[k]).join(' · ');const details=[['주소',r['현장주소'],11],['현장사항',r['현장사항'],6],['현장제원',r['현장제원'],12],['교섭및쟁의사항',r['교섭및쟁의사항'],10]].filter(v=>v[1]).map(v=>`${v[0]}: ${mark(v[1],sheet,i,v[2])}`).join('<br>');return `<article class="card"><div class="top"><div class="branch"><span class="idx">No.${seq}</span>${mark(r['구분']||'-',sheet,i,0)}</div><div class="main"><div class="name">${mark(r['현장명'],sheet,i,2)}</div><div class="meta">${r['임대사']?mark('임대사 · '+r['임대사'],sheet,i,3):'임대사 미정'}${r['현장제원']?' · '+esc(r['현장제원']):''}</div></div><div class="right"><div class="install">${mark(r['설치예정']||'',sheet,i,5)}</div><div class="numbers">${mark(n,sheet,i,7)}</div></div></div><div class="body"><div class="neg">${r['교섭및쟁의사항']?mark(String(r['교섭및쟁의사항']).slice(0,95),sheet,i,10):'교섭내용 없음'}</div><div class="chips">${r['현설예정']?'<span class="chip">현설 '+mark(r['현설예정'],sheet,i,4)+'</span>':''}${r['현장사항']?'<span class="chip">'+mark(r['현장사항'],sheet,i,6)+'</span>':''}</div><div class="details">${details}</div><div class="more">카드 터치 → 상세보기</div></div></article>`}
function contactField(label,value,telephone=false){
  const s=String(value??'').trim();
  const shown=s?(telephone && /[0-9]/.test(s)?`<a href="tel:${esc(s.split(/[~∼]/)[0].replace(/[^0-9+]/g,''))}">${esc(s)}</a>`:esc(s)):'<span class="missing">미등록</span>';
  return `<div class="contact-row"><span>${esc(label)}</span><b>${shown}</b></div>`;
}
function contactCard(r){
  const people=Array.isArray(r['교섭담당자'])?r['교섭담당자']:[];
  const peopleHTML=people.length?people.map(p=>`<div class="contact-person">${contactField('직함',p['직함'])}${contactField('성명',p['성명'])}${contactField('연락처',p['연락처'],true)}</div>`).join(''):'<div class="contact-empty">등록된 교섭 담당자가 없습니다.</div>';
  return `<details class="card contact-card"><summary><span class="name">${esc(r['임대사명']||'임대사명 미등록')}</span><span class="contact-expand" aria-hidden="true">▾</span></summary><div class="contact-content"><div class="contact-rows">${contactField('임대사 연락처',r['임대사연락처'],true)}${contactField('팩스번호',r['팩스번호'])}${contactField('주소',r['주소'])}${contactField('이메일',r['이메일'])}${r['공장주소']?contactField('공장주소',r['공장주소']):''}${r['세금계산서이메일']?contactField('계산서 이메일',r['세금계산서이메일']):''}${r['홈페이지']?contactField('홈페이지',r['홈페이지']):''}</div><div class="contact-title">교섭 담당자</div>${peopleHTML}</div></details>`;
}
function renderContactMode(){
  const active=sheet===CONTACT_TAB;
  document.getElementById('subtabs').hidden=active;
  document.getElementById('rentals').hidden=active;
  document.getElementById('search').placeholder=active?'임대사명, 담당자, 연락처 검색...':'현장명, 구분, 임대사 등 검색...';
  if(!active)return;
  const list=(DATA.rentalContacts||[]).filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
  document.getElementById('count').textContent=`임대사 정보 및 교섭담당자 · ${list.length}개 임대사 (업데이트: ${DATA.updated||'-'})`;
  document.getElementById('list').innerHTML=list.length?list.map(contactCard).join(''):'<div class="empty">등록된 임대사 명함 정보가 없습니다.<p>명함 사진을 대화에 올려주시면 임대사 연락처·팩스·주소와 교섭 담당자를 여기에 정리합니다.</p></div>';
}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});fetch('data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;sheet=names()[0];render()}).catch(e=>{document.getElementById('list').innerHTML='<div class="empty">data.json 불러오기 실패: '+esc(e.message)+'</div>'});
</script></body></html>
